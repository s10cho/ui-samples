<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>찾는 화면이 없어요 — UI 샘플</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --c-bg: #ffffff;
      --c-text: #161b20;
      --c-text-muted: #56616b;
      --c-accent: #0b5f8a;
      --c-accent-hover: #084a6c;
      --c-on-accent: #ffffff;
      --c-focus: #0b5f8a;

      --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      --text-title: 1.5rem;
      --text-body: 1rem;

      --space-2: 0.5rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-7: 3rem;

      --radius: 0.5rem;
      --page-width: 40rem;
      --target: 2.75rem;
      --ring: 3px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--c-bg);
      color: var(--c-text);
      font-family: var(--font);
      font-size: var(--text-body);
      line-height: 1.6;
      word-break: keep-all;
    }

    .page {
      max-width: var(--page-width);
      margin: 0 auto;
      padding: var(--space-7) var(--space-4);
    }

    h1 {
      margin: 0 0 var(--space-2);
      font-size: var(--text-title);
      line-height: 1.3;
    }

    p {
      margin: 0 0 var(--space-5);
      color: var(--c-text-muted);
    }

    .go {
      display: inline-flex;
      align-items: center;
      min-height: var(--target);
      padding: 0 var(--space-4);
      border-radius: var(--radius);
      background: var(--c-accent);
      color: var(--c-on-accent);
      font-weight: 600;
      text-decoration: none;
    }

    .go:hover { background: var(--c-accent-hover); }

    .go:focus-visible {
      outline: var(--ring) solid var(--c-focus);
      outline-offset: var(--ring);
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>찾는 화면이 없어요</h1>
    <p>주소가 바뀌었거나 아직 공개하지 않은 샘플이에요.</p>
    <a class="go" href="/ui-samples/">샘플 목록 보기</a>
  </main>
</body>
</html>
