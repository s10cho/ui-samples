<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>파일 관리자 — 업무 화면 샘플</title>
  <meta name="description" content="폴더와 파일을 목록·격자로 보고 올리기·이름 바꾸기·옮기기·지우기를 하는 업무 화면 샘플이에요.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:,">
  <script>
    (function () {
      var root = document.documentElement;
      // 저장된 화면 밝기를 그리기 전에 적용한다. 저장값이 없으면 밝게 시작한다.
      try {
        var mode = new URLSearchParams(location.search).get('theme') || localStorage.getItem('ds-theme') || 'light';
        if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
      } catch (e) { /* 저장소를 못 읽으면 밝게 */ }
      // 파일로 열면(file://) 브라우저가 웹 글꼴을 막는다. 그때는 시스템 한글 글꼴로 그린다.
      if (location.protocol !== 'file:') {
        [['preload', 'vendor/pretendard/PretendardVariable.page.woff2'], ['stylesheet', 'vendor/pretendard/pretendard-page-subset.css']].forEach(function (item) {
          var link = document.createElement('link');
          link.rel = item[0];
          link.href = item[1];
          if (item[0] === 'preload') { link.as = 'font'; link.type = 'font/woff2'; link.crossOrigin = 'anonymous'; }
          document.head.appendChild(link);
        });
      }
    })();
  </script>
  <noscript>
    <link rel="stylesheet" href="vendor/pretendard/pretendard-page-subset.css">
    <link rel="stylesheet" href="vendor/pretendard/pretendard-dynamic-subset.css">
  </noscript>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page.css">
  <script src="js/ds.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/page.js" defer></script>
</head>
<body>
  <a class="ds-skip-link" href="#main">본문으로 건너뛰기</a>
  <div id="ds-live" class="ds-live" role="status"></div>
  <div id="ds-live-alert" class="ds-live" role="alert"></div>

  <!-- 이 샘플만 쓰는 아이콘 — 목록 보기(줄 앞 점). kit 의 menu 아이콘은 메뉴 버튼 뜻이라 겹쳐 쓰지 않는다 -->
  <svg class="fm-sprite" aria-hidden="true" focusable="false">
    <symbol id="fm-i-list" viewBox="0 0 24 24"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></symbol>
  </svg>

  <div class="ds-app" id="app">
    <header class="ds-app__top ds-topbar">
      <button class="ds-btn ds-btn--ghost ds-btn--icon ds-topbar__menu" type="button" data-ds-nav-toggle aria-controls="nav" aria-expanded="false" aria-label="메뉴 열기">
        <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-menu"></use></svg>
      </button>
      <a class="ds-topbar__brand" href="../index.html">UI 샘플</a>
      <span class="ds-topbar__spacer"></span>
      <div class="ds-segmented" role="radiogroup" aria-label="화면 밝기" data-ds-theme-control>
        <button class="ds-segmented__item" type="button" role="radio" aria-checked="true" data-value="light" aria-label="밝게" data-ds-tip="밝게">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-sun"></use></svg><span class="fm-theme-text">밝게</span>
        </button>
        <button class="ds-segmented__item" type="button" role="radio" aria-checked="false" data-value="dark" aria-label="어둡게" data-ds-tip="어둡게">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-moon"></use></svg><span class="fm-theme-text">어둡게</span>
        </button>
        <button class="ds-segmented__item" type="button" role="radio" aria-checked="false" data-value="system" aria-label="시스템 설정 따르기" data-ds-tip="시스템 설정 따르기">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-monitor"></use></svg><span class="fm-theme-text">시스템</span>
        </button>
      </div>
    </header>

    <nav class="ds-app__nav ds-sidenav" id="nav" aria-label="메뉴">
      <div class="ds-sidenav__close">
        <button class="ds-btn ds-btn--ghost ds-btn--icon" type="button" data-ds-nav-close aria-label="메뉴 닫기">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-close"></use></svg>
        </button>
      </div>
      <div class="ds-nav__group">
        <p class="ds-nav__heading" id="nav-h-files">파일</p>
        <ul class="ds-nav__list" aria-labelledby="nav-h-files">
          <li><a class="ds-nav__link" id="nav-root" href="index.html" aria-current="page"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-folder"></use></svg>내 파일</a></li>
        </ul>
      </div>
      <div class="ds-nav__group">
        <p class="ds-nav__heading" id="nav-h-repo">이 저장소</p>
        <ul class="ds-nav__list" aria-labelledby="nav-h-repo">
          <li><a class="ds-nav__link" href="../index.html"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-home"></use></svg>샘플 목록</a></li>
          <li><a class="ds-nav__link" href="../design-system/index.html"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-columns"></use></svg>부품 모음</a></li>
        </ul>
      </div>
      <div class="fm-storage" id="storage">
        <div class="ds-progress">
          <div class="ds-progress__label"><span id="storage-label">저장 공간</span><span class="ds-progress__value" id="storage-value"></span></div>
          <div class="ds-progress__track" id="storage-track" role="progressbar" aria-labelledby="storage-label" aria-valuemin="0" aria-valuemax="100"><div class="ds-progress__bar" id="storage-bar"></div></div>
        </div>
        <p class="fm-storage__left" id="storage-left"></p>
      </div>
    </nav>

    <main class="ds-app__main" id="main" tabindex="-1">
      <div class="ds-page">
        <header class="ds-page__head fm-head">
          <div class="ds-page__titles">
            <nav class="ds-breadcrumb fm-crumbs" aria-label="폴더 경로">
              <ol id="crumbs"></ol>
            </nav>
            <h1 class="ds-page__title fm-title" id="folder-title" tabindex="-1">내 파일</h1>
          </div>
          <div class="ds-page__actions" id="head-actions">
            <button class="ds-btn ds-btn--primary" type="button" id="btn-upload">
              <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-upload"></use></svg>파일 올리기
            </button>
            <input class="fm-file-input" type="file" id="file-input" multiple hidden>
          </div>
        </header>

        <div class="ds-banner-slot" id="banner-slot"></div>

        <noscript><p class="fm-noscript">이 화면은 자바스크립트가 켜져 있어야 파일을 보여 줘요.</p></noscript>

        <!-- 올리기 카드 — 흐름 안에 둔다(떠 있는 상자는 포커스·아래 작업 줄과 겹친다) -->
        <section class="ds-card fm-uploads" id="uploads" aria-labelledby="up-title" hidden>
          <div class="fm-uploads__head">
            <h2 class="fm-uploads__title" id="up-title" tabindex="-1">파일 올리기</h2>
            <span class="fm-uploads__sum" id="up-sum"></span>
            <span class="ds-toolbar__spacer"></span>
            <button class="ds-btn ds-btn--sm" type="button" id="up-cancel-all" hidden>모두 취소</button>
            <button class="ds-btn ds-btn--sm" type="button" id="up-close" hidden>닫기</button>
          </div>
          <ul class="fm-uploads__list" id="up-list"></ul>
        </section>

        <!-- 결과 — 도구 줄 · 목록(표) 또는 격자. 끌어 놓기를 받는 곳 -->
        <section class="fm-results" id="results" aria-labelledby="results-title">
          <div class="fm-results__body" id="results-body">
            <div class="ds-toolbar fm-toolbar">
              <div class="fm-count">
                <h2 class="fm-count__title" id="results-title" tabindex="-1"><span data-ds-skeleton-keep>항목</span><span id="count-n"></span></h2>
                <span class="fm-count__meta" id="count-meta"></span>
              </div>
              <div class="ds-segmented fm-viewpick" role="radiogroup" aria-label="보기" data-url-key="view">
                <button class="ds-segmented__item" type="button" role="radio" aria-checked="true" data-value="list"><svg class="ds-icon" aria-hidden="true"><use href="#fm-i-list"></use></svg>목록</button>
                <button class="ds-segmented__item" type="button" role="radio" aria-checked="false" data-value="grid"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-grid"></use></svg>격자</button>
              </div>

              <!-- 머리 행이 없는 보기(격자, 좁은 목록)에서만 보인다 — 머리 행이 있으면 머리 행이 같은 일을 한다 -->
              <div class="fm-pick" id="pick-tools">
                <label class="ds-check fm-pick__all"><input type="checkbox" id="sel-all-tb"><span data-ds-skeleton-keep>모두 고르기</span></label>
                <div class="fm-sortpick">
                  <label class="fm-sortpick__label" for="sort-select" data-ds-skeleton-keep>정렬</label>
                  <span class="ds-select">
                    <select id="sort-select">
                      <option value="name.asc">이름 가나다순</option>
                      <option value="name.desc">이름 역순</option>
                      <option value="modified.desc">최근에 고친 것부터</option>
                      <option value="modified.asc">오래전에 고친 것부터</option>
                      <option value="by.asc">고친 사람 가나다순</option>
                      <option value="by.desc">고친 사람 역순</option>
                      <option value="size.desc">큰 것부터</option>
                      <option value="size.asc">작은 것부터</option>
                    </select>
                  </span>
                </div>
              </div>

              <span class="ds-toolbar__spacer"></span>

              <div class="ds-actionbar fm-actionbar" id="actionbar" role="group" aria-label="고른 항목 처리">
                <div class="ds-actionbar__status">
                  <span class="ds-actionbar__count" id="sel-count" hidden></span>
                  <button class="ds-btn ds-btn--ghost ds-btn--sm" type="button" id="btn-unselect" hidden>고르기 풀기</button>
                </div>
                <div class="ds-actionbar__actions">
                  <button class="ds-btn" type="button" id="btn-rename" aria-disabled="true" data-ds-tip="항목을 먼저 골라 주세요">이름 바꾸기</button>
                  <button class="ds-btn" type="button" id="btn-move" aria-disabled="true" aria-haspopup="dialog" data-ds-tip="항목을 먼저 골라 주세요">옮기기…</button>
                  <button class="ds-btn ds-btn--danger-outline" type="button" id="btn-delete" aria-disabled="true" data-ds-tip="항목을 먼저 골라 주세요">지우기</button>
                </div>
              </div>
            </div>

            <div class="ds-table-wrap ds-table-wrap--page fm-wrap" id="list-view">
              <table class="ds-table fm-table" id="file-table" data-url-key="sort">
                <caption class="ds-sr-only" id="table-caption">폴더 항목</caption>
                <thead>
                  <tr>
                    <th scope="col" class="ds-table__select"><label class="ds-hit"><input type="checkbox" id="sel-all" aria-label="이 폴더 항목 모두 고르기"></label></th>
                    <th scope="col" class="fm-col-name" data-ds-skeleton-keep><button class="ds-sort" type="button" data-key="name">이름</button></th>
                    <th scope="col" class="fm-col-date" data-ds-skeleton-keep><button class="ds-sort" type="button" data-key="modified">고친 날짜</button></th>
                    <th scope="col" class="fm-col-by" data-ds-skeleton-keep><button class="ds-sort" type="button" data-key="by">고친 사람</button></th>
                    <th scope="col" class="ds-num fm-col-size" data-ds-skeleton-keep><button class="ds-sort" type="button" data-key="size">크기</button></th>
                  </tr>
                </thead>
                <tbody id="file-rows"></tbody>
              </table>
            </div>

            <ul class="fm-grid" id="grid-view" role="list" aria-labelledby="results-title" hidden></ul>

            <div class="fm-state" id="list-state" hidden></div>
          </div>

          <div class="fm-drop" id="drop" aria-hidden="true" hidden>
            <p class="fm-drop__text"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-upload"></use></svg><span id="drop-text"></span></p>
          </div>
        </section>

        <footer class="fm-foot">
          <p class="ds-sample-note"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-info"></use></svg>가상의 샘플 데이터예요. 실제로 파일을 보내지 않고, 새로고침하면 처음으로 돌아가요.</p>
        </footer>
      </div>
    </main>
  </div>

  <dialog class="ds-dialog ds-dialog--sm fm-move" id="dlg-move" aria-labelledby="move-title">
    <div class="ds-dialog__head"><h2 class="ds-dialog__title" id="move-title">옮기기</h2></div>
    <div class="ds-dialog__body">
      <fieldset class="ds-fieldset fm-tree" aria-describedby="move-error">
        <legend>옮길 폴더</legend>
        <ul class="fm-tree__list" id="move-list"></ul>
      </fieldset>
      <p class="ds-field__error fm-move__error" id="move-error" hidden><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-error"></use></svg><span id="move-error-text"></span></p>
    </div>
    <div class="ds-dialog__foot">
      <button class="ds-btn" type="button" data-ds-close>닫기</button>
      <button class="ds-btn ds-btn--primary" type="button" id="move-run">옮기기</button>
    </div>
  </dialog>
</body>
</html>
