<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>알림 센터</title>
  <meta name="description" content="읽지 않은 알림을 날짜별로 묶어 보고, 읽음 표시와 알림 끄기를 하는 알림 센터 견본이에요.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:,">
  <script>
    (function () {
      var root = document.documentElement;
      // 저장된 화면 밝기를 그리기 전에 적용한다. 저장값이 없으면 밝게 시작한다.
      try {
        var mode = new URLSearchParams(location.search).get('theme') || localStorage.getItem('ds-theme') || 'light';
        if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
      } catch (e) { /* 저장소를 못 읽으면 밝게 */ }
      // 파일로 열면(file://) 브라우저가 웹 글꼴을 막는다. 그때는 시스템 한글 글꼴로 그린다.
      if (location.protocol !== 'file:') {
        [['preload', 'vendor/pretendard/PretendardVariable.page.woff2'], ['stylesheet', 'vendor/pretendard/pretendard-page-subset.css']].forEach(function (item) {
          var link = document.createElement('link');
          link.rel = item[0];
          link.href = item[1];
          if (item[0] === 'preload') { link.as = 'font'; link.type = 'font/woff2'; link.crossOrigin = 'anonymous'; }
          document.head.appendChild(link);
        });
      }
    })();
  </script>
  <noscript>
    <link rel="stylesheet" href="vendor/pretendard/pretendard-page-subset.css">
    <link rel="stylesheet" href="vendor/pretendard/pretendard-dynamic-subset.css">
  </noscript>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page.css">
  <script src="js/ds.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/page.js" defer></script>
</head>
<body>
  <a class="ds-skip-link" href="#notifications" id="skip-feed">알림 목록으로 건너뛰기</a>
  <div id="ds-live" class="ds-live" role="status"></div>
  <div id="ds-live-alert" class="ds-live" role="alert"></div>

  <div class="ds-app nc-app" id="app">
    <header class="ds-app__top ds-topbar nc-topbar">
      <button class="ds-btn ds-btn--ghost ds-btn--icon ds-topbar__menu" type="button" data-ds-nav-toggle aria-controls="nav" aria-expanded="false" aria-label="메뉴 열기">
        <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-menu"></use></svg>
      </button>
      <a class="ds-topbar__brand nc-topbar__brand" href="../index.html">UI 샘플</a>
      <span class="nc-topbar__sep" aria-hidden="true">/</span>
      <span class="nc-topbar__name">알림 센터</span>
      <span class="ds-topbar__spacer"></span>
      <p class="ds-sample-note nc-topbar__note"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-info"></use></svg>가상의 샘플 데이터입니다</p>
      <div class="ds-segmented" role="radiogroup" aria-label="화면 밝기" data-ds-theme-control>
        <button class="ds-segmented__item" type="button" role="radio" aria-checked="true" data-value="light" aria-label="밝게" data-ds-tip="밝게">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-sun"></use></svg><span class="nc-theme-text">밝게</span>
        </button>
        <button class="ds-segmented__item" type="button" role="radio" aria-checked="false" data-value="dark" aria-label="어둡게" data-ds-tip="어둡게">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-moon"></use></svg><span class="nc-theme-text">어둡게</span>
        </button>
        <button class="ds-segmented__item" type="button" role="radio" aria-checked="false" data-value="system" aria-label="시스템 설정 따르기" data-ds-tip="시스템 설정 따르기">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-monitor"></use></svg><span class="nc-theme-text">시스템</span>
        </button>
      </div>
    </header>

    <nav class="ds-app__nav ds-sidenav" id="nav" aria-label="메뉴">
      <div class="ds-sidenav__close">
        <button class="ds-btn ds-btn--ghost ds-btn--icon" type="button" data-ds-nav-close aria-label="메뉴 닫기">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-close"></use></svg>
        </button>
      </div>
      <div class="ds-nav__group">
        <p class="ds-nav__heading" id="nav-h-work">작업 공간</p>
        <ul class="ds-nav__list" aria-labelledby="nav-h-work">
          <li><a class="ds-nav__link" href="./" aria-current="page"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-bell"></use></svg><span>알림</span><span class="ds-nav__count" id="nav-count"></span></a></li>
          <li><a class="ds-nav__link" href="../support-inbox/index.html"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-chat"></use></svg>상담 인박스</a></li>
          <li><a class="ds-nav__link" href="../settings/index.html"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-sliders"></use></svg>설정</a></li>
        </ul>
      </div>
      <div class="ds-nav__group">
        <p class="ds-nav__heading" id="nav-h-repo">이 저장소</p>
        <ul class="ds-nav__list" aria-labelledby="nav-h-repo">
          <li><a class="ds-nav__link" href="../index.html"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-grid"></use></svg>샘플 목록</a></li>
          <li><a class="ds-nav__link" href="../design-system/index.html"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-folder"></use></svg>부품 모음</a></li>
        </ul>
      </div>
    </nav>

    <main class="ds-app__main" id="main" tabindex="-1">
      <div class="ds-page nc-page">
        <div class="ds-page__head">
          <div class="ds-page__titles">
            <h1 class="ds-page__title" id="page-title">알림</h1>
          </div>
          <div class="ds-page__actions" id="head-actions">
            <button class="ds-btn" type="button" id="btn-markall" data-busy-label="표시 중…">
              <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-success"></use></svg><span id="markall-text">모두 읽음 표시</span>
            </button>
            <a class="ds-btn" href="../settings/index.html?tab=notifications" id="link-settings">
              <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-sliders"></use></svg>알림 설정
            </a>
          </div>
        </div>

        <div class="ds-banner-slot" id="banner-slot"></div>

        <section class="nc-feed" id="notifications" aria-labelledby="page-title" tabindex="-1">
          <div class="nc-tools" id="feed-tools">
            <div class="ds-segmented nc-view" role="radiogroup" aria-label="보기" data-url-key="view" id="view">
              <button class="ds-segmented__item" type="button" role="radio" aria-checked="true" data-value="unread">읽지 않음 <span class="ds-count nc-n" data-count-view="unread"></span></button>
              <button class="ds-segmented__item" type="button" role="radio" aria-checked="false" data-value="all">전체 <span class="ds-count nc-n" data-count-view="all"></span></button>
            </div>
            <div class="nc-kinds" id="kinds-row">
              <div class="ds-chips" role="group" aria-label="종류로 거르기" id="kinds">
                <button class="ds-chip" type="button" aria-pressed="false" data-kind="assign"><svg class="ds-icon ds-chip__check" aria-hidden="true"><use href="#ds-i-check"></use></svg>배정 <span class="ds-count nc-n" data-count-kind="assign"></span><span class="nc-chip__off" hidden><span aria-hidden="true">· </span>꺼짐</span></button>
                <button class="ds-chip" type="button" aria-pressed="false" data-kind="mention"><svg class="ds-icon ds-chip__check" aria-hidden="true"><use href="#ds-i-check"></use></svg>언급 <span class="ds-count nc-n" data-count-kind="mention"></span><span class="nc-chip__off" hidden><span aria-hidden="true">· </span>꺼짐</span></button>
                <button class="ds-chip" type="button" aria-pressed="false" data-kind="reply"><svg class="ds-icon ds-chip__check" aria-hidden="true"><use href="#ds-i-check"></use></svg>답장 <span class="ds-count nc-n" data-count-kind="reply"></span><span class="nc-chip__off" hidden><span aria-hidden="true">· </span>꺼짐</span></button>
                <button class="ds-chip" type="button" aria-pressed="false" data-kind="digest"><svg class="ds-icon ds-chip__check" aria-hidden="true"><use href="#ds-i-check"></use></svg>요약 <span class="ds-count nc-n" data-count-kind="digest"></span><span class="nc-chip__off" hidden><span aria-hidden="true">· </span>꺼짐</span></button>
                <button class="ds-chip" type="button" aria-pressed="false" data-kind="security"><svg class="ds-icon ds-chip__check" aria-hidden="true"><use href="#ds-i-check"></use></svg>보안 <span class="ds-count nc-n" data-count-kind="security"></span><span class="nc-chip__off" hidden><span aria-hidden="true">· </span>꺼짐</span></button>
              </div>
              <button class="ds-btn ds-btn--ghost ds-btn--sm" type="button" id="btn-clear" hidden>거르기 지우기</button>
            </div>
          </div>

          <div class="nc-arrivals" id="arrivals" hidden>
            <button class="ds-btn ds-btn--sm" type="button" id="btn-arrivals"></button>
          </div>

          <div class="nc-body" id="feed-body" aria-busy="false"></div>
        </section>
      </div>
    </main>

    <aside class="ds-app__panel ds-panel nc-panel" id="panel" aria-labelledby="panel-title" hidden>
      <div class="ds-panel__head">
        <h2 class="ds-panel__title" id="panel-title" tabindex="-1">알림 내용</h2>
        <button class="ds-btn ds-btn--ghost ds-btn--icon" type="button" data-ds-panel-close aria-label="알림 내용 닫기" data-ds-tip="알림 내용 닫기">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-close"></use></svg>
        </button>
      </div>
      <div class="ds-panel__body" id="panel-body"></div>
    </aside>
  </div>
</body>
</html>
