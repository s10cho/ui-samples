<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>검색 결과 — UI 샘플</title>
  <meta name="description" content="검색어와 필터로 문서·사람·업무를 찾고 결과를 정렬하는 업무 화면 샘플이에요.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:,">
  <script>
    (function () {
      var root = document.documentElement;
      // 저장된 화면 밝기를 그리기 전에 적용한다. 저장값이 없으면 밝게 시작한다.
      try {
        var mode = new URLSearchParams(location.search).get('theme') || localStorage.getItem('ds-theme') || 'light';
        if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
      } catch (e) { /* 저장소를 못 읽으면 밝게 */ }
      // 파일로 열면(file://) 브라우저가 웹 글꼴을 막는다. 그때는 시스템 한글 글꼴로 그린다.
      if (location.protocol !== 'file:') {
        [['preload', 'vendor/pretendard/PretendardVariable.page.woff2'], ['stylesheet', 'vendor/pretendard/pretendard-page-subset.css']].forEach(function (item) {
          var link = document.createElement('link');
          link.rel = item[0];
          link.href = item[1];
          if (item[0] === 'preload') { link.as = 'font'; link.type = 'font/woff2'; link.crossOrigin = 'anonymous'; }
          document.head.appendChild(link);
        });
      }
    })();
  </script>
  <noscript>
    <link rel="stylesheet" href="vendor/pretendard/pretendard-page-subset.css">
    <link rel="stylesheet" href="vendor/pretendard/pretendard-dynamic-subset.css">
  </noscript>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page.css">
  <script src="js/ds.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/page.js" defer></script>
</head>
<body>
  <a class="ds-skip-link" href="#main">본문으로 건너뛰기</a>
  <div id="ds-live" class="ds-live" role="status"></div>
  <div id="ds-live-alert" class="ds-live" role="alert"></div>

  <div class="ds-app" id="app">
    <header class="ds-app__top ds-topbar">
      <button class="ds-btn ds-btn--ghost ds-btn--icon ds-topbar__menu" type="button" data-ds-nav-toggle aria-controls="nav" aria-expanded="false" aria-label="메뉴 열기">
        <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-menu"></use></svg>
      </button>
      <a class="ds-topbar__brand" href="../index.html">UI 샘플</a>
      <span class="ds-topbar__spacer"></span>
      <div class="ds-segmented" role="radiogroup" aria-label="화면 밝기" data-ds-theme-control>
        <button class="ds-segmented__item" type="button" role="radio" aria-checked="true" data-value="light" aria-label="밝게" data-ds-tip="밝게">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-sun"></use></svg><span class="sr-theme-text">밝게</span>
        </button>
        <button class="ds-segmented__item" type="button" role="radio" aria-checked="false" data-value="dark" aria-label="어둡게" data-ds-tip="어둡게">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-moon"></use></svg><span class="sr-theme-text">어둡게</span>
        </button>
        <button class="ds-segmented__item" type="button" role="radio" aria-checked="false" data-value="system" aria-label="시스템 설정 따르기" data-ds-tip="시스템 설정 따르기">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-monitor"></use></svg><span class="sr-theme-text">시스템</span>
        </button>
      </div>
    </header>

    <nav class="ds-app__nav ds-sidenav" id="nav" aria-label="메뉴">
      <div class="ds-sidenav__close">
        <button class="ds-btn ds-btn--ghost ds-btn--icon" type="button" data-ds-nav-close aria-label="메뉴 닫기">
          <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-close"></use></svg>
        </button>
      </div>
      <div class="ds-nav__group">
        <p class="ds-nav__heading" id="nav-h-work">작업 공간</p>
        <ul class="ds-nav__list" aria-labelledby="nav-h-work">
          <li><a class="ds-nav__link" href="index.html" aria-current="page"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-search"></use></svg>검색</a></li>
        </ul>
      </div>
      <div class="ds-nav__group">
        <p class="ds-nav__heading" id="nav-h-repo">이 저장소</p>
        <ul class="ds-nav__list" aria-labelledby="nav-h-repo">
          <li><a class="ds-nav__link" href="../index.html"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-home"></use></svg>샘플 목록</a></li>
          <li><a class="ds-nav__link" href="../design-system/index.html"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-grid"></use></svg>부품 모음</a></li>
        </ul>
      </div>
    </nav>

    <main class="ds-app__main" id="main" tabindex="-1">
      <div class="ds-page">
        <header class="ds-page__head">
          <div class="ds-page__titles">
            <h1 class="ds-page__title">검색</h1>
            <p class="ds-page__desc">문서·사람·업무를 한 번에 찾아요.</p>
          </div>
        </header>

        <form class="sr-search" id="search-form" role="search" aria-label="문서·사람·업무 검색" novalidate>
          <div class="ds-field sr-search__field">
            <label class="ds-field__label" for="q">검색어</label>
            <div class="sr-search__row">
              <span class="ds-search">
                <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-search"></use></svg>
                <input class="ds-input" id="q" name="q" type="search" placeholder="예: 정산 보고서…" autocomplete="off" enterkeyhint="search" spellcheck="false">
              </span>
              <button class="ds-btn ds-btn--primary" type="submit">검색</button>
            </div>
            <p class="ds-field__error" id="q-error" hidden><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-error"></use></svg><span id="q-error-text"></span></p>
          </div>
        </form>

        <noscript><p class="sr-noscript">이 화면은 자바스크립트가 켜져 있어야 검색 결과를 보여 줘요.</p></noscript>

        <!-- 처음(검색 전) — 최근 검색어와 자주 찾는 말 -->
        <div class="sr-start" id="start" hidden>
          <section class="sr-start__group" aria-labelledby="recent-title">
            <div class="sr-start__head">
              <h2 class="sr-start__title" id="recent-title" tabindex="-1">최근 검색어</h2>
              <button class="ds-btn ds-btn--ghost ds-btn--sm" type="button" id="recent-clear">모두 지우기</button>
            </div>
            <ul class="sr-recent" id="recent-list"></ul>
            <p class="sr-start__none" id="recent-none" hidden>최근 검색어가 없어요</p>
          </section>
          <section class="sr-start__group" aria-labelledby="popular-title">
            <h2 class="sr-start__title" id="popular-title">자주 찾는 말</h2>
            <ul class="sr-popular" id="popular-list"></ul>
          </section>
        </div>

        <!-- 결과 — 종류 탭 · 필터 · 건수와 정렬 · 걸린 필터 · 목록 -->
        <section class="sr-results" id="results" aria-labelledby="results-title" hidden>
          <div class="sr-results__body" id="results-body">
            <div class="ds-tabs sr-tabs" role="tablist" aria-label="결과 종류" data-url-key="type" id="tabs">
              <button class="ds-tab" type="button" role="tab" id="tab-all" aria-controls="tp-all" aria-selected="true" data-value="all"><span data-ds-skeleton-keep>전체</span><span class="ds-count" aria-hidden="true" data-count></span><span class="ds-sr-only" data-count-sr></span></button>
              <button class="ds-tab" type="button" role="tab" id="tab-doc" aria-controls="tp-doc" aria-selected="false" data-value="doc"><span data-ds-skeleton-keep>문서</span><span class="ds-count" aria-hidden="true" data-count></span><span class="ds-sr-only" data-count-sr></span></button>
              <button class="ds-tab" type="button" role="tab" id="tab-person" aria-controls="tp-person" aria-selected="false" data-value="person"><span data-ds-skeleton-keep>사람</span><span class="ds-count" aria-hidden="true" data-count></span><span class="ds-sr-only" data-count-sr></span></button>
              <button class="ds-tab" type="button" role="tab" id="tab-task" aria-controls="tp-task" aria-selected="false" data-value="task"><span data-ds-skeleton-keep>업무</span><span class="ds-count" aria-hidden="true" data-count></span><span class="ds-sr-only" data-count-sr></span></button>
            </div>

            <div class="sr-layout">
              <aside class="sr-side" id="facet-side" aria-label="필터"></aside>

              <div class="sr-main">
                <div class="ds-toolbar sr-bar">
                  <h2 class="sr-count" id="results-title" tabindex="-1"></h2>
                  <span class="ds-toolbar__spacer"></span>
                  <div class="sr-bar__tools">
                    <button class="ds-btn sr-filter-open" type="button" id="btn-filters" data-ds-drawer="filter-drawer" aria-haspopup="dialog" aria-controls="filter-drawer" aria-expanded="false">
                      <svg class="ds-icon" aria-hidden="true"><use href="#ds-i-filter"></use></svg><span data-ds-skeleton-keep>필터</span><span class="ds-count ds-count--accent" id="filter-n" aria-hidden="true" hidden></span><span class="ds-sr-only" id="filter-n-sr"></span>
                    </button>
                    <div class="sr-sort">
                      <label class="sr-sort__label" for="sort" data-ds-skeleton-keep>정렬</label>
                      <span class="ds-select"><select id="sort" name="sort">
                        <option value="rel">관련도순</option>
                        <option value="recent">최신순</option>
                      </select></span>
                    </div>
                  </div>
                </div>

                <div class="sr-active" id="active" hidden>
                  <span class="sr-active__label" id="active-label" data-ds-skeleton-keep>걸린 필터</span>
                  <div class="ds-chips" role="group" aria-labelledby="active-label" id="active-list"></div>
                  <button class="ds-btn ds-btn--sm" type="button" id="active-clear">모두 지우기</button>
                </div>

                <div class="sr-panel" role="tabpanel" id="tp-all" aria-labelledby="tab-all"></div>
                <div class="sr-panel" role="tabpanel" id="tp-doc" aria-labelledby="tab-doc" hidden></div>
                <div class="sr-panel" role="tabpanel" id="tp-person" aria-labelledby="tab-person" hidden></div>
                <div class="sr-panel" role="tabpanel" id="tp-task" aria-labelledby="tab-task" hidden></div>
              </div>
            </div>
          </div>

          <!-- 결과 없음 · 불러오기 오류 — 탭·필터 없이 결과 자리에 -->
          <div class="sr-message" id="results-msg" hidden></div>
        </section>

        <footer class="sr-foot">
          <p class="ds-sample-note"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-info"></use></svg>가상의 샘플 데이터예요. 최근 검색어는 이 브라우저에만 남아요.</p>
        </footer>
      </div>
    </main>

    <aside class="ds-app__panel ds-panel sr-preview" id="preview" aria-labelledby="preview-title" data-url-key="preview" hidden>
      <div class="ds-panel__head">
        <h2 class="ds-panel__title" id="preview-title" tabindex="-1"></h2>
        <button class="ds-btn ds-btn--ghost ds-btn--icon" type="button" data-ds-panel-close aria-label="미리 보기 닫기"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-close"></use></svg></button>
      </div>
      <div class="ds-panel__body" id="preview-body"></div>
    </aside>
  </div>

  <dialog class="ds-dialog ds-drawer" id="filter-drawer" aria-labelledby="drawer-title">
    <div class="ds-dialog__head">
      <h2 class="ds-dialog__title" id="drawer-title">필터</h2>
      <button class="ds-btn ds-btn--ghost ds-btn--icon" type="button" data-ds-close aria-label="필터 닫기"><svg class="ds-icon" aria-hidden="true"><use href="#ds-i-close"></use></svg></button>
    </div>
    <div class="ds-dialog__body" id="drawer-body"></div>
    <div class="ds-dialog__foot">
      <button class="ds-btn ds-btn--ghost" type="button" id="drawer-clear">모두 지우기</button>
      <button class="ds-btn ds-btn--primary" type="button" data-ds-close id="drawer-done">결과 보기</button>
    </div>
  </dialog>
</body>
</html>
